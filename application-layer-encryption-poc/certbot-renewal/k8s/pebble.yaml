apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: application-layer-certbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 14000
            - containerPort: 15000
          env:
            - name: PEBBLE_VA_ALWAYS_VALID
              value: "1"
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: pebble
  namespace: application-layer-certbot
spec:
  selector:
    app: pebble
  ports:
    - name: acme
      port: 14000
      targetPort: 14000
    - name: roots
      port: 15000
      targetPort: 15000
