apiVersion: batch/v1
kind: Job
metadata:
  name: certbot-issue
  namespace: application-layer-certbot
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: certbot-runner
      containers:
        - name: certbot
          image: application-layer-certbot:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/certbot-run.sh"]
          env:
            - name: RUN_MODE
              value: "issue"
          volumeMounts:
            - name: certbot-data
              mountPath: /etc/letsencrypt
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: certbot-data
          persistentVolumeClaim:
            claimName: certbot-data
        - name: scripts
          configMap:
            name: certbot-script
