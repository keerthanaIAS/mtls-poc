apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: application-layer-encryption
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: application-gateway:poc
          imagePullPolicy: Never
          ports:
            - containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: gateway-certs
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: gateway-certs
          secret:
            secretName: gateway-certs
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: application-layer-encryption
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: https
      port: 8443
      targetPort: 8443
