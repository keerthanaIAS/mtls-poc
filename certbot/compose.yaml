services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command:
      - -config
      - test/config/pebble-config.json
      - -dnsserver
      - 172.28.0.10:8053
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      - "14000:14000"
      - "15000:15000"
    networks:
      acme-net:
        ipv4_address: 172.28.0.2
    depends_on:
      - challtestsrv

  challtestsrv:
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command:
      - -defaultIPv6=
      - -defaultIPv4
      - 172.28.0.10
    ports:
      - "8055:8055"
    networks:
      acme-net:
        ipv4_address: 172.28.0.10

networks:
  acme-net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
