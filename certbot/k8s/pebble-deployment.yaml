apiVersion: apps/v1
kind: Deployment
metadata:
  name: pebble
  namespace: certbot-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pebble
  template:
    metadata:
      labels:
        app: pebble
    spec:
      containers:
        - name: pebble
          image: ghcr.io/letsencrypt/pebble:latest
          args:
            - "-config"
            - "test/config/pebble-config.json"
            - "-dnsserver"
            - "10.110.221.133:8053"
          env:
            - name: PEBBLE_VA_NOSLEEP
              value: "1"
          ports:
            - name: acme
              containerPort: 14000
            - name: management
              containerPort: 15000
