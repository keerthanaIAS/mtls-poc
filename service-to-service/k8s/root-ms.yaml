apiVersion: apps/v1
kind: Deployment
metadata:
  name: root-ms
  namespace: mtls-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: root-ms
  template:
    metadata:
      labels:
        app: root-ms
    spec:
      containers:
        - name: root-ms
          image: mtls-root-ms:poc
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: TRANSACTION_HOST
              value: transaction-ms.mtls-services.svc.cluster.local
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
      volumes:
        - name: certs
          secret:
            secretName: root-ms-certs
---
apiVersion: v1
kind: Service
metadata:
  name: root-ms
  namespace: mtls-services
spec:
  selector:
    app: root-ms
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP